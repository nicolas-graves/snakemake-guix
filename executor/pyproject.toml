[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakemake-executor-plugin-guix-ssh"
version = "0.1.0"
description = "Execute Snakemake jobs over SSH using immutable Guix profiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "snakemake-interface-common>=1.23.0,<2",
  "snakemake-interface-executor-plugins>=9.4.0,<10",
  "snakemake-software-deployment-plugin-guix>=0.4.0,<1",
]

[project.entry-points."snakemake.executor_plugins"]
guix-ssh = "snakemake_executor_plugin_guix_ssh"

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_executor_plugin_guix_ssh"]

[tool.pytest.ini_options]
pythonpath = ["src", "../deployment"]
