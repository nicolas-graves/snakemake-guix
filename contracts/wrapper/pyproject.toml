[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakemake_contracts_wrapper"
version = "0.8.3"
description = "Snakemake rule wrapper that expands named inputs, outputs, and params into script CLI arguments"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/nicolas-graves/snakemake-guix"
Repository = "https://github.com/nicolas-graves/snakemake-guix"
Source = "https://github.com/nicolas-graves/snakemake-guix/tree/master/contracts/wrapper"
Issues = "https://github.com/nicolas-graves/snakemake-guix/issues"

[tool.hatch.build.targets.wheel]
packages = ["snakemake_contracts_wrapper"]
