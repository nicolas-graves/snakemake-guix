[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakemake-executor-plugin-guix-openstack"
version = "0.2.2"
description = "Run Guix-backed Snakemake jobs on ephemeral OpenStack instances"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "snakemake-executor-plugin-guix-ssh>=0.2.0,<0.3",
  "openstacksdk>=4.6.0,<5",
]

[project.scripts]
snakemake-guix-openstack-reap = "snakemake_executor_plugin_guix_openstack.reap:main"
snakemake-guix-openstack-image = "snakemake_executor_plugin_guix_openstack.image:main"
snakemake-guix-openstack-openrc = "snakemake_executor_plugin_guix_openstack.openrc:main"

[project.entry-points."snakemake.executor_plugins"]
guix-openstack = "snakemake_executor_plugin_guix_openstack"

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_executor_plugin_guix_openstack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
